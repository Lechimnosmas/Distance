<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>distance V1.html</title>
<style>
body{margin:0;background:#111;color:#fff;font-family:-apple-system,BlinkMacSystemFont,sans-serif}
.app{max-width:600px;margin:auto;padding:22px 18px}
h1{text-align:center;margin:4px 0}.sub{text-align:center;color:#999;margin-bottom:18px}
.camera{height:48vh;min-height:300px;border-radius:20px;overflow:hidden;background:#222;position:relative}
video{width:100%;height:100%;object-fit:cover}
.cross{position:absolute;left:50%;top:50%;width:34px;height:34px;transform:translate(-50%,-50%)}
.cross:before,.cross:after{content:"";position:absolute;background:#fff}
.cross:before{width:34px;height:2px;top:16px}.cross:after{height:34px;width:2px;left:16px}
.read{text-align:center;margin:20px 0}.dist{font-size:56px}.unit{font-size:24px;color:#aaa}
.method{font-size:17px;margin-top:8px}.conf{font-size:14px;color:#999;margin-top:5px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}button{padding:16px;border:0;border-radius:14px;background:#333;color:#fff;font-size:17px;font-weight:600}
.primary{background:#1677ff}.status{margin-top:15px;padding:13px;border-radius:12px;background:#1d1d1d;color:#aaa;font-size:14px}
</style>
</head>
<body>
<div class="app">
<h1>Distance</h1>
<div class="sub">Prototype V1 — iPhone</div>
<div class="camera"><video id="video" autoplay playsinline muted></video><div class="cross"></div></div>
<div class="read">
  <div><span id="distance" class="dist">— —</span> <span class="unit">m</span></div>
  <div id="method" class="method">Aucune mesure</div>
  <div id="confidence" class="conf">Visez un objet et appuyez sur MESURER</div>
</div>
<div class="grid">
<button id="start" class="primary">DÉMARRER</button>
<button id="measure" disabled>MESURER</button>
<button id="lock" disabled>VERROUILLER</button>
<button id="reset" disabled>NOUVELLE MESURE</button>
</div>
<div id="status" class="status">La V1 active la caméra. Le LiDAR et la vraie mesure par parallaxe seront intégrés dans l'étape suivante.</div>
</div>
<script>
let stream=null,locked=false;
const $=id=>document.getElementById(id);
async function startApp(){
 try{
  stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}},audio:false});
  $("video").srcObject=stream;
  if(typeof DeviceMotionEvent!=="undefined"&&typeof DeviceMotionEvent.requestPermission==="function"){
   const p=await DeviceMotionEvent.requestPermission();
   if(p!=="granted") throw Error("Capteurs refusés");
  }
  $("start").disabled=true;$("measure").disabled=false;$("reset").disabled=false;
  $("status").textContent="Caméra active. Visez précisément l'objet à mesurer.";
 }catch(e){$("status").textContent="Caméra/capteurs non disponibles. Autorisez-les et utilisez HTTPS.";console.error(e)}
}
function measureNow(){
 if(locked)return;

 $("distance").textContent="TEST";
 $("method").textContent="Le bouton MESURER fonctionne";
 $("confidence").textContent="JavaScript actif";
 $("status").textContent="La commande MESURER est bien reçue.";
}
function resetApp(){
 locked=false;$("distance").textContent="— —";$("method").textContent="Aucune mesure";
 $("confidence").textContent="Visez un objet et appuyez sur MESURER";
 $("measure").disabled=!stream;$("lock").disabled=true;
 $("status").textContent="Prêt pour une nouvelle mesure.";
}
$("start").onclick=startApp;$("measure").onclick=measureNow;$("reset").onclick=resetApp;
</script>
</body>
</html>
